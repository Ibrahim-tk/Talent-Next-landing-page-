<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tal — the blob</title>

<!--
  ============================================================================
  TAL'S MARK — THE BLOB, ON ITS OWN
  ----------------------------------------------------------------------------
  Just the circle. No plate, no card, no summary, no typing.

  ONE VARIABLE DRIVES IT. Every length below is a calc() off `--orb-size`, so
  the whole mark scales from a single number — set it on `.orb` (or on any
  ancestor) and the blades, their box and the body follow. Nothing here is
  sized in absolute pixels except that one declaration.

  The blade polygons are the brand geometry, carried over verbatim from the
  live component. They are authored as percentages, which is why they hold at
  any diameter from a 24px byline mark to a full-bleed hero.

  To drop it into a page: copy the `.orb` block of CSS and the `<span
  class="orb">` markup. The `:root` colours and the demo staging below are the
  only other things in this file, and neither is part of the mark.
  ============================================================================
-->

<style>
  :root {
    --rose-500: #ff6e60;   /* --gl-rose-500 — the hue the body is built from */
    --radius-full: 9999px; /* --gl-radius-full */
  }

  * { box-sizing: border-box; }

  /* Staging only — delete everything in this block and the mark is unaffected. */
  html, body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background-color: #ffffff;
  }

  /* ==========================================================================
     The mark
     ========================================================================== */
  .orb {
    /* THE one number. Everything else is a fraction of it. */
    --orb-size: 160px;

    position: relative;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--orb-size);
    height: var(--orb-size);
    border-radius: var(--radius-full);

    /* The body: rose at the top-left falling to near-white at the
       bottom-right. That single 145° ramp is what gives a flat circle its
       roundness — there is no shadow, no highlight and no second layer doing
       it, which is why the mark stays crisp at any size and on any ground. */
    background: linear-gradient(
      145deg,
      var(--rose-500) 0%,
      color-mix(in srgb, var(--rose-500) 78%, #fff) 26%,
      color-mix(in srgb, var(--rose-500) 52%, #fff) 52%,
      color-mix(in srgb, var(--rose-500) 32%, #fff) 74%,
      color-mix(in srgb, var(--rose-500) 20%, #fff) 100%
    );
  }

  /* The three blades sit in a box exactly half the orb's width, centred by the
     flex on `.orb`. Half is the ratio the glyph is drawn at — the polygons
     below fill this box edge to edge, so the optical margin around the mark is
     set here and nowhere else. */
  .orb__mark {
    position: relative;
    width: calc(var(--orb-size) * 0.5);
    height: calc(var(--orb-size) * 0.5);
  }

  /* Each blade is a plain white box clipped to one chevron. Clip rather than
     an SVG path or a glyph: it costs no request, it cannot be mis-rendered by
     a font fallback, and the three shapes stay independently addressable if
     they are ever animated. */
  .orb__blade {
    position: absolute;
    inset: 0;
    background: #fff;
  }

  .orb__blade--a { clip-path: polygon(29.56% 22.88%, 18.77% 23.14%, 42.67% 49.87%, 2.57% 95.12%, 13.37% 95.12%, 53.21% 49.87%); }
  .orb__blade--b { clip-path: polygon(62.21% 35.22%, 51.67% 35.48%, 64.52% 49.87%, 24.68% 95.12%, 35.22% 95.12%, 75.06% 50.13%); }
  .orb__blade--c { clip-path: polygon(46.79% 4.37%, 86.38% 49.87%, 64.78% 74.55%, 75.58% 74.55%, 96.92% 49.61%, 57.07% 4.37%); }
</style>
</head>

<body>

<span class="orb" aria-hidden="true">
  <span class="orb__mark">
    <span class="orb__blade orb__blade--a"></span>
    <span class="orb__blade orb__blade--b"></span>
    <span class="orb__blade orb__blade--c"></span>
  </span>
</span>

</body>
</html>
