<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tal Orb</title>
<link rel="stylesheet" href="tal-orb.css">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;background:#0b0c0e;color:#e7e7ea;
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:40px;padding:56px 24px}
  h1{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0}
  .stage{display:flex;align-items:center;justify-content:center;min-height:340px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px}
  button{font:inherit;color:inherit;background:#17181c;border:1px solid #2a2c33;
         border-radius:999px;padding:7px 15px;cursor:pointer}
  button:hover{background:#1f2027}
  button[aria-pressed="true"]{background:#f9423a;border-color:#f9423a;color:#fff}
  .sizes{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;justify-content:center}
  .sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
  /* the box bleeds well past the sphere, so a plain flex row staggers the
     captions — pin each orb into a fixed cell and align the captions instead */
  .sizes .cell{display:flex;align-items:center;justify-content:center;
               width:120px;height:120px}
  figcaption{font-size:12px;color:#8b8d96}
</style>
</head>
<body>

<h1>Tal Orb</h1>

<div class="stage">
  <span class="borb" id="hero" data-state="idle" style="--borb-size:288px" aria-hidden="true">
    <span class="borb__ripple"></span>
    <span class="borb__ripple borb__ripple--2"></span>
    <span class="borb__field">
      <span class="borb__cloud borb__cloud--1"></span>
      <span class="borb__cloud borb__cloud--2"></span>
      <span class="borb__cloud borb__cloud--3"></span>
      <span class="borb__cloud borb__cloud--4"></span>
    </span>
    <span class="borb__mark">
      <span class="borb__blade borb__blade--a"></span>
      <span class="borb__blade borb__blade--b"></span>
      <span class="borb__blade borb__blade--c"></span>
      <svg class="borb__waves" viewBox="0 0 100 100" aria-hidden="true">
        <path d=""/><path d=""/><path d=""/>
      </svg>
    </span>
  </span>
</div>

<div class="bar" id="bar"></div>

<div class="sizes" id="sizes"></div>

<script src="tal-orb.js"></script>
<script>
(function(){
  var STATES = ['idle','listening','thinking','thinking2','thinking3','speaking','loading','error'];
  var hero = document.getElementById('hero');
  var bar  = document.getElementById('bar');

  function markup(size, state){
    return '<span class="borb" data-state="' + state + '" style="--borb-size:' + size + 'px" aria-hidden="true">'
      + '<span class="borb__ripple"></span><span class="borb__ripple borb__ripple--2"></span>'
      + '<span class="borb__field"><span class="borb__cloud borb__cloud--1"></span>'
      + '<span class="borb__cloud borb__cloud--2"></span><span class="borb__cloud borb__cloud--3"></span>'
      + '<span class="borb__cloud borb__cloud--4"></span></span>'
      + '<span class="borb__mark"><span class="borb__blade borb__blade--a"></span>'
      + '<span class="borb__blade borb__blade--b"></span><span class="borb__blade borb__blade--c"></span>'
      + '<svg class="borb__waves" viewBox="0 0 100 100" aria-hidden="true"><path d=""/><path d=""/><path d=""/></svg>'
      + '</span></span>';
  }

  STATES.forEach(function(s){
    var b = document.createElement('button');
    b.textContent = s;
    b.setAttribute('aria-pressed', String(s === 'idle'));
    b.addEventListener('click', function(){
      hero.setAttribute('data-state', s);
      Array.prototype.forEach.call(bar.children, function(el){
        el.setAttribute('aria-pressed', String(el === b));
      });
    });
    bar.appendChild(b);
  });

  /* the same component at the sizes a real app uses it at */
  var sizes = document.getElementById('sizes');
  [[20,'20px'],[32,'32px'],[64,'64px'],[112,'112px']].forEach(function(pair){
    var fig = document.createElement('figure');
    fig.innerHTML = '<span class="cell">' + markup(pair[0], 'thinking') + '</span>'
                  + '<figcaption>' + pair[1] + '</figcaption>';
    sizes.appendChild(fig);
  });

  /* anything printed after DOMContentLoaded has to be mounted by hand */
  window.BorbOrb.mountAll(sizes);
}());
</script>
</body>
</html>
