<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Multi-stop Vibrant Spectrum Gradient -->
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.85" />
      <stop offset="22%" stop-color="#EA580C" stop-opacity="0.9" />
      <stop offset="42%" stop-color="#D13739" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="58%" stop-color="#3B82F6" stop-opacity="0.85" />
      <stop offset="78%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.85" />
    </linearGradient>

    <!-- Radial Mask to fade edges and top smoothly -->
    <radialGradient id="bloomMask" cx="50%" cy="85%" r="65%" fx="50%" fy="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <mask id="rayFadeMask">
      <rect width="1200" height="560" fill="url(#bloomMask)" />
    </mask>
  </defs>

  <g mask="url(#rayFadeMask)">
    <!-- Base Spectrum Wash -->
    <rect width="1200" height="560" fill="url(#spectrumGrad)" opacity="0.45" />
    
